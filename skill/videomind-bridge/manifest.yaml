name: videomind-bridge
version: 3.0.0
description: 视频知识提取工具 - v2 提取引擎 (成本感知路由) + v1 下载/转录/摘要
author: VideoMind
license: MIT
homepage: https://github.com/yiwenxu123/VideoMind-Bridge

categories:
  - productivity
  - media

compatibility:
  - python>=3.11
  - network-access: true

requirements:
  bins:
    - uv
    - yt-dlp
  anyBins:
    - ffmpeg
  env: []

primaryEnv: COZE_API_KEY

platforms:
  - darwin
  - linux

entry: scripts/process.sh

inputs:
  - name: url
    type: string
    required: true
    description: 视频链接

  - name: mode
    type: string
    required: false
    default: extract
    description: 处理模式
    enum:
      - extract
      - smart
      - prescreen
      - archive
      - full
      - download
      - transcribe

  - name: model
    type: string
    required: false
    default: small
    description: Whisper 模型大小 (仅 v1 模式)
    enum:
      - tiny
      - base
      - small
      - medium

  - name: targets
    type: string
    required: false
    default: local
    description: 导出目标，逗号分隔 (v1 full 模式 / v2 archive 模式)

  - name: keep_video
    type: boolean
    required: false
    default: true
    description: 是否保留视频文件 (仅 v1 模式)

outputs:
  - name: success
    type: boolean
    description: 是否处理成功

  - name: title
    type: string
    description: 视频标题

  - name: content
    type: string
    description: 提取的文字内容 (v2)

  - name: source
    type: string
    description: 使用的提取器 (v2)

  - name: cost_tier
    type: string
    description: 提取成本等级 (v2)

  - name: metadata
    type: object
    description: 视频元数据

  - name: transcript
    type: object
    description: 转录结果 (v1)

  - name: summary
    type: object
    description: AI 摘要结果 (v1)
