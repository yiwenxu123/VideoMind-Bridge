<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoMind Bridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: linear-gradient(135deg, #00a1d6 0%, #0089b5 100%);
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .header-text p {
      font-size: 12px;
      opacity: 0.9;
    }

    .status-bar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-bottom: 1px solid #e8e8e8;
    }

    .status-bar.connected {
      background: #f6ffed;
      color: #52c41a;
    }

    .status-bar.disconnected {
      background: #fff2f0;
      color: #ff4d4f;
    }

    .content {
      padding: 20px;
    }

    .current-page {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .current-page h3 {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .page-url {
      font-size: 13px;
      color: #333;
      word-break: break-all;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00a1d6 0%, #0089b5 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 161, 214, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary.processing {
      background: linear-gradient(135deg, #faad14 0%, #d48806 100%);
    }

    .recent-tasks {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .recent-tasks h3 {
      font-size: 13px;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .task-item {
      padding: 12px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .task-item:hover {
      border-color: #00a1d6;
      background: #f0f9ff;
    }

    .task-item:last-child {
      margin-bottom: 0;
    }

    .task-title {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #999;
    }

    .task-status {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
    }

    .task-status.pending {
      background: #f0f0f0;
      color: #666;
    }

    .task-status.processing {
      background: #e6f7ff;
      color: #1890ff;
    }

    .task-status.completed {
      background: #f6ffed;
      color: #52c41a;
    }

    .task-status.failed {
      background: #fff2f0;
      color: #ff4d4f;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 13px;
    }

    .footer {
      padding: 12px 20px;
      text-align: center;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #e8e8e8;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">📝</div>
    <div class="header-text">
      <h1>VideoMind Bridge</h1>
      <p>视频智能处理助手</p>
    </div>
  </div>

  <div id="status-bar" class="status-bar disconnected">
    <span id="status-icon">⚠️</span>
    <span id="status-text">正在连接服务...</span>
  </div>

  <div class="content">
    <div class="current-page">
      <h3>当前页面</h3>
      <div id="page-url" class="page-url">-</div>
      <button id="process-btn" class="btn-primary" disabled>
        <span>📝</span>
        <span>处理当前视频</span>
      </button>
    </div>

    <div class="recent-tasks">
      <h3>
        最近任务
        <span id="task-count"
