[project]
name = "VideoMind-Bridge"
version = "3.0.0"
description = "智能视频处理工具，支持下载、转录、AI 摘要和导出"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VideoMind Team", email = "team@videomind.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["video", "ai", "transcription", "summarization", "downloader"]
dependencies = [
    "faster-whisper>=1.2.1",
    "yt-dlp>=2026.7.4",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
    "keyring>=25.7.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "mcp>=2.3",
]

[project.optional-dependencies]
bench = [
    "jiwer>=3.0.0",
    "psutil>=5.9.0",
]
sensevoice = [
    "sherpa-onnx>=1.13.8",
    "soundfile>=0.12.1",
]
dev = [
    # 工具版本与 uv.lock 对齐并加上界：CI 用 pip install -e ".[dev]"，
    # 不加上界就会装到比本地更新的 mypy/ruff，出现「本地绿、CI 红」的推断差异
    # （2026-11-26 实测：mypy 1.20 对 List[Literal] 的推断比 1.19 更严）。
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<1.20",
    "types-PyYAML>=6.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
videomind = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "S101", "SIM102", "SIM117", "E402"]
"src/core/extractors/__init__.py" = ["F401", "E402"]  # 延迟导入触发注册模式

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
# integration: 真打网络的测试（tests/test_real_network.py）。
# 默认跳过，用 VMB_RUN_INTEGRATION=1 开启；不要在 CI 里默认跑，会依赖本机网关。
markers = [
    "integration: 需要真实网络与本机服务的端到端测试（默认跳过）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/api/*",
    "*/cli.py",
    "*/app.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 75
